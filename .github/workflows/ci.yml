name: Comprehensive CI

on:
  push:
    branches: [ main, stabilization-*, feature/* ]
  pull_request:
    branches: [ main, stabilization-* ]
  workflow_dispatch:

env:
  PYTHON_DEFAULT_VERSION: "3.11"

jobs:
  # Pre-commit and code quality checks
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Cache pre-commit
        uses: actions/cache@v3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.PYTHON_DEFAULT_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  # Backend API testing with matrix
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: selfos
          POSTGRES_PASSWORD: selfos_test
          POSTGRES_DB: selfos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-backend-${{ matrix.python-version }}-${{ hashFiles('apps/backend_api/requirements.txt') }}
          restore-keys: |
            pip-backend-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          cd apps/backend_api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist coverage[toml]

      - name: Create test environment
        run: |
          cd apps/backend_api
          cat > .env.test << EOF
          DATABASE_URL=postgresql://selfos:selfos_test@localhost:5432/selfos_test
          REDIS_URL=redis://localhost:6379/0
          SECRET_KEY=test-secret-key-for-ci-${{ github.run_id }}
          AI_PROVIDER=local
          MEMORY_VECTOR_STORE=memory
          EVENT_SYSTEM_ENABLED=true
          LOG_LEVEL=INFO
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/dummy-firebase.json
          TESTING=true
          PYTEST_CURRENT_TEST=true
          EOF
          echo '{"type": "service_account", "project_id": "test-${{ github.run_id }}"}' > /tmp/dummy-firebase.json

      - name: Run database migrations
        run: |
          cd apps/backend_api
          export $(cat .env.test | xargs)
          alembic upgrade head

      - name: Run backend tests with coverage
        run: |
          cd apps/backend_api
          export $(cat .env.test | xargs)
          python -m pytest \
            --cov=. \
            --cov-report=xml:coverage-backend.xml \
            --cov-report=html:htmlcov-backend \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --junit-xml=pytest-backend.xml \
            -n auto \
            --dist=worksteal \
            -v

      - name: Upload backend coverage to artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-backend-py${{ matrix.python-version }}
          path: |
            apps/backend_api/coverage-backend.xml
            apps/backend_api/htmlcov-backend/
            apps/backend_api/pytest-backend.xml

  # MCP Server testing with matrix
  mcp-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-mcp-${{ matrix.python-version }}-${{ hashFiles('apps/backend_api/requirements.txt') }}
          restore-keys: |
            pip-mcp-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          # Install backend_api dependencies first (MCP server depends on them)
          cd apps/backend_api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          # Install additional testing dependencies for MCP
          pip install pytest pytest-asyncio pytest-cov pytest-xdist coverage[toml]

      - name: Run MCP server tests with coverage
        run: |
          cd apps/mcp_server
          python -m pytest \
            --cov=. \
            --cov-report=xml:coverage-mcp.xml \
            --cov-report=html:htmlcov-mcp \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --junit-xml=pytest-mcp.xml \
            -n auto \
            --dist=worksteal \
            -v

      - name: Upload MCP coverage to artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-mcp-py${{ matrix.python-version }}
          path: |
            apps/mcp_server/coverage-mcp.xml
            apps/mcp_server/htmlcov-mcp/
            apps/mcp_server/pytest-mcp.xml

  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install security tools
        run: |
          pip install safety bandit pip-audit

      - name: Run safety check on backend API
        run: |
          cd apps/backend_api
          safety check --file requirements.txt --output json --save-json safety-backend.json || true

      - name: Run bandit security scan
        run: |
          bandit -r apps/ -f json -o bandit-report.json --skip B101 || true

      - name: Run pip-audit
        run: |
          cd apps/backend_api
          pip-audit --format=json --output=pip-audit.json -r requirements.txt || true

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            apps/backend_api/safety-backend.json
            bandit-report.json
            apps/backend_api/pip-audit.json

  # Build Docker images to ensure they work
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          tags: selfos-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MCP server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/mcp.Dockerfile
          push: false
          tags: selfos-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Combined coverage report
  coverage-report:
    name: Combined Coverage Report
    runs-on: ubuntu-latest
    needs: [backend-tests, mcp-tests]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install coverage tools
        run: pip install coverage[toml]

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v3
        with:
          path: coverage-artifacts

      - name: Combine coverage reports
        run: |
          # Find and copy coverage files
          find coverage-artifacts -name "coverage-*.xml" -exec cp {} . \;
          
          # Create combined coverage report
          coverage combine coverage-backend.xml coverage-mcp.xml || true
          coverage report --format=markdown > coverage-summary.md || true
          coverage html -d htmlcov-combined || true

      - name: Upload combined coverage
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-combined
          path: |
            coverage-summary.md
            htmlcov-combined/

  # Final status check
  ci-success:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, backend-tests, mcp-tests, security, build]
    if: always()
    steps:
      - name: Check CI results
        run: |
          echo "CI Results Summary:"
          echo "✅ Lint: ${{ needs.lint.result }}"
          echo "✅ Backend Tests: ${{ needs.backend-tests.result }}"
          echo "✅ MCP Tests: ${{ needs.mcp-tests.result }}"
          echo "✅ Security: ${{ needs.security.result }}"
          echo "✅ Build: ${{ needs.build.result }}"
          
          # Determine overall success
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.backend-tests.result }}" == "success" && \
                "${{ needs.mcp-tests.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" ]]; then
            echo "🎉 All critical checks passed!"
            exit 0
          else
            echo "❌ Some critical checks failed"
            exit 1
          fi
