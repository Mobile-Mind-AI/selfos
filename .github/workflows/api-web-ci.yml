name: API & Web CI

on:
  pull_request:
  push:
    branches: [ dev/phase2 ]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/requirements.txt') }}
      - name: Install deps
        working-directory: apps/api
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt
      - name: Import check
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api
        run: |
          . .venv/bin/activate
          python - <<'PY'
          from app.api.main import create_app
          app = create_app()
          print('API OK, routes:', len(app.routes))
          PY
      - name: Export OpenAPI
        working-directory: apps/api
        run: |
          ./scripts/export_openapi.sh > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: openapi.json
          path: apps/api/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint -- --no-error-on-unmatched-pattern
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

